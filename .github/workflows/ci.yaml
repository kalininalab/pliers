name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python has no upper bound, so a new machine usually gets the newest
        # interpreter; test every version a fresh `uv venv` can pick.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Create virtual environment
        run: uv venv
      - name: Install
        run: uv pip install -e ".[dev, workflow]" --torch-backend=cpu
      - name: Unit tests
        run: uv run pytest -m "not gpu and not snakemake" --cov=pliers --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Create virtual environment
        run: uv venv
      - name: Install
        run: uv pip install -e ".[dev,workflow]" --torch-backend=cpu
      - name: Pipeline integration tests
        shell: bash -el {0}
        run: uv run pytest -m "snakemake and not gpu"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Create virtual environment
        run: uv venv
      - name: Install
        run: uv pip install -e ".[docs]" --torch-backend=cpu
      - name: Build docs
        run: uv run sphinx-build -W --keep-going -b html docs/source docs/_build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
